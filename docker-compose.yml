services:
  pixelflow-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: pixelflow:latest
    ports:
      - "8000:8000"
    environment:
      PIXELFLOW_MAX_UPLOAD_BYTES: "10485760"
      PIXELFLOW_MAX_IMAGE_PIXELS: "64000000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
