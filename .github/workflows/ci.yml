name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --python ${{ matrix.python-version }}

      - name: Run ruff linter
        run: uv run --python ${{ matrix.python-version }} ruff check .

      - name: Run ruff format check
        run: uv run --python ${{ matrix.python-version }} ruff format --check .

      - name: Run mypy strict type check
        run: uv run --python ${{ matrix.python-version }} mypy --strict src tests

      - name: Run pytest with coverage
        run: uv run --python ${{ matrix.python-version }} pytest --cov=pixelflow --cov-fail-under=90 --cov-report=term-missing

  docker-build:
    runs-on: ubuntu-latest
    needs: quality-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t pixelflow:ci .
