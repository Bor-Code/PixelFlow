[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pixelflow"
version = "0.1.0"
description = "Composable image processing pipeline library with CLI and REST API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pixelflow Contributors" }]
dependencies = [
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.0",
    "pillow>=10.3.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.12",
    "pre-commit>=3.7.0",
]

[project.scripts]
pixelflow = "pixelflow.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pixelflow"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "C4", "RUF"]
ignore = ["UP046", "UP047"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["pixelflow"]

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pixelflow --cov-report=term-missing"

[tool.coverage.run]
source = ["pixelflow"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

